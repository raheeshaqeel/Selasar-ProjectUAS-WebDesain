<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selasar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Cormorant+Garamond:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="landing-page-style.css">
</head>
<body class="landing">

  <!-- decoration -->
  <svg class="bg-deco" viewBox="0 0 1728 1117" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" />
      </filter>
      <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5" />
      </filter>
    </defs>

    <g fill="none" stroke-linecap="round">

      <g stroke="#3a2f8f" stroke-width="5" opacity="0.55" filter="url(#softer)">
        <path d="M150 15 C150 80 90 115 20 115 C-50 115 -110 80 -110 15" />
        <path d="M150 125 C150 190 90 225 20 225 C-50 225 -110 190 -110 125" />
      </g>

      <g filter="url(#soft)">
        <circle cx="1010" cy="240" r="225" stroke="#5b3fd6" stroke-width="10" opacity="0.7" />
        <path d="M945 8 A 275 275 0 0 1 1178 125" stroke="#c2573f" stroke-width="7" opacity="0.65" />
      </g>

      <g filter="url(#soft)">
        <circle cx="1650" cy="935" r="275" stroke="#5b3fd6" stroke-width="10" opacity="0.6" />
        <path d="M1395 995 A 310 310 0 0 0 1570 1117" stroke="#c2573f" stroke-width="7" opacity="0.6" />
      </g>

      <g stroke="#5a2f3f" stroke-width="3" opacity="0.5" filter="url(#softer)">
        <path d="M-10 900 L150 1010 L175 1117" />
        <path d="M-10 960 L95 1040 L110 1117" />
      </g>
    </g>
  </svg>

  <main class="landing-main">

    <section class="hero">
      <img class="hero-logo" src="/logo/Logo-Selasar.png" alt="Logo Selasar">

      <h1 class="wordmark">Selasar</h1>
      <p class="tagline">Ruang terbuka untuk kreativitas.</p>

      <div class="hero-actions">
        <a class="btn btn-primary" href="masuk.html">Masuk</a>
        <a class="btn btn-outline" href="daftar.html">Daftar</a>
      </div>
    </section>

    <section class="gallery" aria-label="Galeri karya">
      <div class="gallery-col col-a">
        <img class="foto-1" src="/imgs/foto1.jpeg" alt="Lukisan pemandangan di dinding">
        <img class="foto-3" src="/imgs/foto2.jpeg" alt="Sosok dengan asap berwarna">
      </div>
      <div class="gallery-col col-b">
        <img class="foto-2" src="/imgs/foto3.jpeg" alt="Ruang galeri dengan lukisan">
        <img class="foto-4" src="/imgs/foto4.jpeg" alt="Dinding galeri merah dengan bingkai emas">
      </div>
    </section>

  </main>

</body>
</html>
