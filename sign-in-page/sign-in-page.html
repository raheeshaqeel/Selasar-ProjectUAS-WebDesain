<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Selasar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Cormorant+Garamond:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="sign-in-style.css">
</head>
<body>

  <div class="auth">

    <section class="auth-art">
      <img src="/sign-in-page/img/foto6.jpeg" alt="Lukisan langit-langit klasik">
    </section>

    <main class="auth-panel">
      <div class="auth-box">
        <h1 class="wordmark">Selasar</h1>

        <form class="form" action="#" method="post">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" autocomplete="email">

          <label for="sandi">Kata Sandi</label>
          <input type="password" id="sandi" name="sandi" autocomplete="current-password">

          <a class="link-forgot" href="lupa-sandi.html">Lupa kata sandi?</a>

          <button class="btn-block" type="submit" href="../choose-roles/choose_role.html">Masuk</button>
        </form>
        
        <p class="switch">Belum punya akun? <a href="../register-page/register-page.html">Daftar</a></p>

        <div class="divider">Atau</div>

        <button class="btn-google" type="button">

          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/>
            <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Masuk dengan Google
        </button>
      </div>
    </main>

  </div>

</body>
</html>
