<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Selasar</title>
</head>
<body>

  <!-- ===== BAGIAN KIRI: gambar lukisan ===== -->
  <section>
    <img src="lukisan.jpg" alt="Lukisan langit-langit klasik">
  </section>

  <!-- ===== BAGIAN KANAN: form daftar ===== -->
  <main>
    <h1>Selasar</h1>

    <form action="#" method="post">
      <label for="email">Alamat Email</label>
      <input type="email" id="email" name="email">

      <label for="username">Nama Pengguna</label>
      <input type="text" id="username" name="username">

      <label for="sandi">Kata Sandi</label>
      <input type="password" id="sandi" name="sandi">

      <label for="verifikasi">Verifikasi Sandi</label>
      <input type="password" id="verifikasi" name="verifikasi">

      <input type="checkbox" id="setuju" name="setuju">
      <label for="setuju">
        Saya berusia setidaknya 16 tahun dan menyetujui
        <a href="ketentuan.html">Ketentuan Penggunaan</a>.
      </label>

      <button type="submit">Daftar</button>
    </form>
  </main>

</body>
</html>
