<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Warga</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <img src="img/logo_selasar.png" alt="Logo" />
      <a href="#"><img src="img/beranda.png" alt="Pengaturan" width="30" /></a>
      <a href="#"
        ><img src="img/artistpage.png" alt="Pengaturan" width="30"
      /></a>
      <a href="#"><img src="img/maps.png" alt="Pengaturan" width="30" /></a>
      <a href="#"
        ><img src="img/komunitas.png" alt="Pengaturan" width="30"
      /></a>
      <a href="#"><img src="img/notif.png" alt="Pengaturan" width="30" /></a>
      <a href="#"><img src="img/setting.png" alt="Pengaturan" width="30" /></a>
    </aside>

    <main>
      <header class="topbar">
        <a href="#" class="kembali" aria-label="Kembali">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <h1>hanjehanje</h1>
      </header>

      <div class="banner"></div>

      <!-- INFO PROFIL -->
      <section class="profil">
        <img src="img/profil.png" alt="Foto Profil" width="150" />
        <div class="profilinfo">
          <h2>@hanjehanje</h2>
          <span class="badge">Warga</span>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-label">Pengikut</span>
            <span class="stat-value">3</span>
          </div>
          <div class="stat">
            <span class="stat-label">Mengikuti</span>
            <span class="stat-value">200</span>
          </div>
        </div>

        <a href="#" class="edit">Edit Profil</a>
      </section>

      <section class="kreator">
        <div class="pindahkreator">
          <h3>Bawa Karyamu Ke Level Selanjutnya</h3>
          <p>
            Dapatkan akses ke analitik mendalam, pantau pengunjung secara
            real-time, dan kelola portofoliomu dengan lebih profesional.
          </p>
          <a href="Profil_kreator.html" class="Kreator">Ubah Menjadi Kreator</a>
        </div>
      </section>
    </main>
