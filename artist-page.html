<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Page</title>
    <style>
        /* Layout saja — tanpa warna/dekorasi */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ul { list-style: none; }
        img { display: block; max-width: 100%; }

        body {
            display: grid;
            grid-template-columns: 100px 1fr;
            grid-template-areas:
                "aside main"
                "aside footer";
            min-height: 100vh;
        }

        /* Sidebar */
        aside {
            grid-area: aside;
            position: sticky; top: 0;
            height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 32px 0;
            border-right: 1px solid;
        }
        aside > nav { flex: 1; margin-top: 40px; }
        aside > nav ul {
            height: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 24px;
        }
        aside > nav li:last-child { margin-top: auto; }
        aside img { width: 32px; height: 32px; }
        aside > div img { width: 48px; height: 48px; }

        /* Main */
        main { grid-area: main; padding: 40px 48px; }

        header { display: flex; align-items: center; gap: 24px; }
        header form { flex: 1; display: flex; align-items: center; gap: 8px; }
        header form label {
            position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
        }
        header form input { flex: 1; height: 44px; padding: 0 16px; }
        header form button img { width: 20px; height: 20px; }
        header > div { position: relative; }
        header > div > a img { width: 48px; height: 48px; border-radius: 50%; }
        header > div ul {
            position: absolute; top: 100%; right: 0;
            min-width: 160px; border: 1px solid; padding: 8px;
        }

        /* Kategori */
        section[aria-label="Kategori Karya"] { margin-top: 20px; }
        section[aria-label="Kategori Karya"] ul { display: flex; flex-wrap: wrap; gap: 12px; }
        section[aria-label="Kategori Karya"] a {
            display: inline-block; padding: 4px 20px;
            border: 1px solid; border-radius: 999px;
        }

        /* Galeri grid */
        section[aria-label="Galeri Karya"] { margin-top: 32px; }
        section[aria-label="Galeri Karya"] h2 { margin-bottom: 16px; }
        section[aria-label="Galeri Karya"] > div {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        article { border: 1px solid; padding: 8px; }
        figure img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
        figcaption { margin-top: 8px; }

        /* Muat lebih banyak */
        section[aria-label="Navigasi Halaman"] {
            display: flex; justify-content: center; margin-top: 40px;
        }

        /* Footer */
        footer {
            grid-area: footer;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px;
            margin: 0 48px; padding: 24px 0;
            border-top: 1px solid;
        }
        footer ul { display: flex; gap: 20px; }

        /* Responsif */
        @media (max-width: 1024px) {
            section[aria-label="Galeri Karya"] > div { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            body {
                grid-template-columns: 1fr;
                grid-template-areas: "main" "footer" "aside";
            }
            aside {
                position: sticky; bottom: 0; top: auto;
                height: auto; flex-direction: row; padding: 12px;
                border-right: 0; border-top: 1px solid;
            }
            aside > div { display: none; }
            aside > nav { margin: 0; width: 100%; }
            aside > nav ul { flex-direction: row; justify-content: space-around; gap: 0; }
            aside > nav li:last-child { margin-top: 0; }
            main { padding: 20px 16px; }
            section[aria-label="Galeri Karya"] > div { grid-template-columns: 1fr; }
            footer { margin: 0 16px; flex-direction: column; }
        }
    </style>
</head>
