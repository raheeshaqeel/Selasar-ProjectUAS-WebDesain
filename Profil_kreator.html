          <li>

          <li>

      <header>
        <a href="#">&lt; Kembali</a>
        <h1>hanjehanje</h1>

      <!-- BANNER -->
      <img src="img/banner.png" alt="Banner" width="100%" />

      <section>
        <img src="img/avatar.png" alt="Foto Profil" width="200" />
        <h2>@hanjehanje</h2>
        <p><strong>Kreator</strong></p>

        <table>
          <tr>
            <th>Karya</th>
            <th>Pengikut</th>

            <td>8</td>

        </table>

        <button>Edit Profil</button><br />

      <!-- TAB -->
      <nav>
        <a href="#"><img src="img/tab-galeri.png" alt="Galeri" width="30" /></a>

        <img src="img/karya1.png" alt="Karya 1" width="250" />
        <img src="img/karya2.png" alt="Karya 2" width="250" />
