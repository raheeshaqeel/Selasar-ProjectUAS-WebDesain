<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Kreator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <aside class="sidebar">
      <img src="img/logo_selasar.png" alt="Logo" />
      <a href="#"><img src="img/beranda.png" alt="Pengaturan" width="30" /></a>
      <a href="#"
        ><img src="img/artistpage.png" alt="Pengaturan" width="30"
      /></a>
      <a href="#"><img src="img/maps.png" alt="Pengaturan" width="30" /></a>
      <a href="#"
        ><img src="img/komunitas.png" alt="Pengaturan" width="30"
      /></a>
      <a href="#"><img src="img/notif.png" alt="Pengaturan" width="30" /></a>
      <a href="#"><img src="img/setting.png" alt="Pengaturan" width="30" /></a>
    </aside>

    <main>
      <header class="topbar">
        <a href="#" class="kembali" aria-label="Kembali">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <h1>hanjehanje</h1>
      </header>

      <img src="img/banner.png" alt="Banner" width="100%" />
      <div class="banner-kreator"></div>

      <section class="profil-kreator">
        <img src="img/profil.png" alt="Foto Profil" width="150" />
        <div class="profil-info-kreator">
          <h2>@hanjehanje</h2>
          <span class="badge-kreator">Kreator</span>
        </div>

        <div class="stats-kreator">
          <div class="stat">
            <span class="stat-label">Karya</span>
            <span class="stat-value">8</span>
          </div>
          <div class="stat">
            <span class="stat-label">Pengikut</span>
            <span class="stat-value">3</span>
          </div>
          <div class="stat">
            <span class="stat-label">Mengikuti</span>
            <span class="stat-value">200</span>
          </div>
        </div>

        <a href="#" class="edit-kreator">Edit Profil</a>
        <a href="#" class="analitik">Analitik</a>
        <a href="#" class="Unggah">Unggah</a>
        
      </section>

      <nav>
        <a href="#"><img src="img/tab-galeri.png" alt="Galeri" width="30" /></a>
        <a href="#"><img src="img/tab-privat.png" alt="Privat" width="30" /></a>
        <a href="#"
          ><img src="img/tab-simpan.png" alt="Tersimpan" width="30"
        /></a>
      </nav>

      <section>
        <img src="img/karya1.png" alt="Karya 1" width="250" />
        <img src="img/karya2.png" alt="Karya 2" width="250" />
        <img src="img/karya3.png" alt="Karya 3" width="250" />
        <img src="img/karya4.png" alt="Karya 4" width="250" />
        <img src="img/karya5.png" alt="Karya 5" width="250" />
        <img src="img/karya6.png" alt="Karya 6" width="250" />
        <img src="img/karya7.png" alt="Karya 7" width="250" />
        <img src="img/karya8.png" alt="Karya 8" width="250" />
      </section>
    </main>
  </body>
</html>
