<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda Kreator</title>
  <link rel="stylesheet" href="beranda.css">
</head>
<body class="page-beranda">

  <main class="container">
    
    <header class="topbar">
      <form class="search-box">
        <span class="icon-search"></span>
        <input type="search" placeholder="Cari acara yang ingin kamu kunjungi">
        <button type="button" class="icon-camera"></button>
        <button type="button" class="icon-mic"></button>
      </form>

      <div class="profile-menu">
        <img src="avatar.jpg" alt="Profil Pengguna" class="avatar is-kreator">
        <button type="button" class="icon-chevron"></button>
      </div>
    </header>

    <nav class="category-bar">
      <button type="button" class="chip active">Seni Visual</button>
      <button type="button" class="chip">Pertunjukan</button>
      <button type="button" class="chip">Musik</button>
      <button type="button" class="chip">Film &amp; Media</button>
      <button type="button" class="chip">Desain</button>
      <button type="button" class="chip">Literasi</button>
    </nav>

    <section class="events-grid">

      <article class="card">
        <img src="event-1.jpg" alt="Festival Kota Tua">
        <div class="card-body">
          <div class="card-header">
            <h2>Festival Kota Tua</h2>
            <span class="tag tag-orange">Desain</span>
            <button type="button" class="icon-bookmark"></button>
          </div>
          <ul class="card-meta">
            <li class="meta-date">1 Januari - 7 Januari 2026</li>
            <li class="meta-price">Gratis</li>
            <li class="meta-loc">Kota Tua, Jakarta</li>
          </ul>
        </div>
      </article>

    </section>

  </main>

</body>
</html>
